<form (submit)="onSubmit($event)">
    <mat-form-field>
        <mat-label>Email</mat-label>
        <input matInput type="email" [formField]="loginForm.email">
    </mat-form-field>
    <mat-form-field>
        <mat-label>Password</mat-label>
        <input type="password" matInput [formField]="loginForm.password">
    </mat-form-field>
    <button matButton="filled" type="submit">Login</button>
</form>
