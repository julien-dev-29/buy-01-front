<a routerLink="my-products" class="text-2xl text-cyan-600">All Products</a>

<mat-grid-list cols="4" rowHeight="">
    @for (item of products(); track $index) {
    <mat-grid-tile>
        <mat-card>
            <mat-card-header>
                <mat-card-title>
                    {{item.name}}
                </mat-card-title>
            </mat-card-header>
            <img mat-card-md-image [src]="item.mediaIds">
            <mat-card-content>
                {{ item.description}}
            </mat-card-content>
        </mat-card>
    </mat-grid-tile>
    }
</mat-grid-list>
